name: Deploy to GitHub Pages

on:
  # Every push to `astro`, the branch the site is built from.
  push:
    branches: [astro]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

# One deployment at a time. A newer push waits instead of cancelling one that's halfway out.
concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned to a full commit SHA (the tag is in the comment), so a moved or hijacked
# tag can't change what runs. Dependabot keeps the pins current.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install, build, and upload your site
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          # Astro 7.4.7 and later need Node >= 22.23.4; "22" gets the newest 22.
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
